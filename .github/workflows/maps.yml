name: Maps

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Cancel running builds of the same ref; do not cancel the Pages deployment.
concurrency:
  group: maps-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  maps:
    name: Render maps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dependencies
        run: pip install pillow numpy

      - name: Fetch fonts
        # Lora and Poppins are not part of the Ubuntu packages. If the download fails,
        # map_cover.py falls back to DejaVu/Liberation — the layout stays the same.
        run: |
          dir=/usr/share/fonts/truetype/google-fonts
          sudo mkdir -p "$dir"
          base=https://github.com/google/fonts/raw/main/ofl
          get() { sudo curl -fsSL --retry 3 -o "$dir/$2" "$1" || echo "font missing: $2"; }
          get "$base/lora/Lora-Italic%5Bwght%5D.ttf" Lora-Italic-Variable.ttf
          get "$base/poppins/Poppins-Medium.ttf" Poppins-Medium.ttf
          get "$base/poppins/Poppins-Bold.ttf" Poppins-Bold.ttf
          fc-cache -f > /dev/null

      - name: Render maps
        run: python3 map_cover.py --out out

      - name: Build site
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          BUILD_DATE=$(date -u +%Y-%m-%d) python3 build_site.py --png out --out site

      - name: Maps and icons as artifact
        # The images for review in the pull request — there are no tests, the image is the check.
        uses: actions/upload-artifact@v4
        with:
          name: collection-icons
          path: |
            out/*.png
            site/icons/*.png
            site/pwa/*.png
          if-no-files-found: error
          retention-days: 30

      - name: Site as Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  pages:
    name: Publish GitHub Page
    if: github.event_name != 'pull_request'
    needs: maps
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
